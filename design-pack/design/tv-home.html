<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>tv-home</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet"><style>body{margin:0}.f{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#F3F6FB}button{font-family:inherit;border:0;cursor:pointer}</style></head><body><div class="f" style="width:960px;height:540px;box-sizing:border-box;background:#0E1525;display:flex;flex-direction:column;overflow:hidden;padding:27px 48px;gap:16px"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:28px;font-weight:700">Khóa TV</div><div style="font-size:20px;color:#9FB0CC;">Thứ Tư · 19:42</div></div><div style="display:flex;gap:20px;flex:1"><div style="background:#172035;border-radius:24px;flex:1.5;padding:28px;display:flex;flex-direction:column;gap:10px"><span style="display:inline-block;padding:6px 18px;border-radius:20px;background:#3DDC97;color:#06261A;font-size:16px;font-weight:700;letter-spacing:1px">ĐANG MỞ</span><div style="font-size:64px;font-weight:700;line-height:1.1;margin-top:8px">1 giờ 12 phút</div><div style="font-size:22px;color:#9FB0CC;">còn lại hôm nay</div><div style="height:14px;border-radius:7px;background:#26324D;margin-top:auto"><div style="width:40%;height:14px;border-radius:7px;background:#3DDC97"></div></div><div style="display:flex;justify-content:space-between;font-size:18px;color:#9FB0CC;"><span>Đã xem 48 phút</span><span>Giới hạn 2 giờ</span></div></div><div style="background:#172035;border-radius:24px;flex:1;padding:28px;display:flex;flex-direction:column;gap:18px"><div style="font-size:20px;font-weight:700">Hôm nay</div><div><div style="font-size:16px;color:#9FB0CC;">Giờ thời sự</div><div style="font-size:22px;font-weight:600">19:00 – 19:30</div></div><div><div style="font-size:16px;color:#9FB0CC;">Khóa đêm</div><div style="font-size:22px;font-weight:600">21:00 – 06:30</div></div><div><div style="font-size:16px;color:#9FB0CC;">Phút thưởng</div><div style="font-size:22px;font-weight:600">0 phút</div></div></div></div><div style="display:flex;gap:10px"><button style="height:52px;padding:0 18px;border-radius:14px;font-size:20px;font-weight:600;background:#FF6B6B;color:#2A0A0A;flex:auto;">Khóa ngay</button><button style="height:52px;padding:0 18px;border-radius:14px;font-size:20px;font-weight:600;background:#3DDC97;color:#06261A;flex:auto;">Mở khóa</button><button style="height:52px;padding:0 18px;border-radius:14px;font-size:20px;font-weight:600;background:#202C45;color:#F3F6FB;flex:auto;">+5</button><button style="height:52px;padding:0 18px;border-radius:14px;font-size:20px;font-weight:600;background:#FFB84D;color:#1A1405;flex:auto;outline:4px solid #fff;box-shadow:0 0 0 9px rgba(255,184,77,.45);transform:scale(1.06);">+10</button><button style="height:52px;padding:0 18px;border-radius:14px;font-size:20px;font-weight:600;background:#202C45;color:#F3F6FB;flex:auto;">+15</button><button style="height:52px;padding:0 18px;border-radius:14px;font-size:20px;font-weight:600;background:#202C45;color:#F3F6FB;flex:auto;">+30</button><button style="height:52px;padding:0 18px;border-radius:14px;font-size:20px;font-weight:600;background:#202C45;color:#F3F6FB;flex:auto;">Cài đặt</button></div></div></body></html>
